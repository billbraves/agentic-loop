# .agentic/config.toml — project adaptation layer.
# Role mappings, path conventions, quality gates and safety rules specific to
# this project. Edit the values below, then run `agentic contract diff --apply`
# to re-render the governance contracts.

[project]
iterations_dir = "docs/plans"
# default_output_language = "English"

# ── 本地 kiro 网关（official 接入）─────────────────────────────
# 本机跑着两个网关，均为 kiro 后端：
#   127.0.0.1:18080  anthropic /v1/messages + openai /v1  ← claude 用
#   127.0.0.1:18090  litellm，转发到 18080，openai /v1/responses  ← codex 用
# 拆成两个 provider 条目而非一个：identity_model 是独立性评级的唯一依据
# （independence.evaluate 只看它），reviewer 与 consultant 必须落在不同
# identity_model 上才评得到 strong。合成一个条目会退回同源 weak。
#
# key 只存 env 名，绝不落盘明文。两个网关当前都是占位 key
# （litellm 侧 master_key=dummy），但 adapter 一律按真 key 对待。
[providers.kiroopus]
anthropic_base_url = "http://127.0.0.1:18080"               # claude 用
api_key_env        = "ANTHROPIC_API_KEY"
identity_model     = "claude-opus-5"                        # canonical
[providers.kiroopus.selectors]
claude = "claude-opus-5"

# provider 名不带连字符：CodexAdapter 把它拼进
# `-c model_providers.<name>.base_url=...`，连字符在 codex 的 inline TOML
# 解析里可能被当表达式。也刻意不叫 `kiro`——避免 inline 覆盖与
# ~/.codex/config.toml 里已有的 [model_providers.kiro] 混淆难排查。
[providers.kirogpt]
openai_base_url    = "http://127.0.0.1:18090/v1"            # codex 用
api_key_env        = "OPENAI_API_KEY"
identity_model     = "gpt-5.6-sol"                          # canonical
[providers.kirogpt.selectors]
codex = "gpt-5.6-sol"

[roles]
# reviewer=opus5 / consultant=gpt5.6 已是异源，但 gate 路径下仍评 weak
# （reviewer identity 不可观测，原因见 [review_policy]）。
orchestrator = "claude"
# developer 不绑 provider：binding=None 时 adapter 零注入，kimi 走自己的全局
# 默认（kimi-for-coding）。绑了也不影响评级——只有 review.decision == "N/A"
# 时才用 executor.tool 构造 implementer_id，那里只有 tool 名没有 model，
# independence._model_known() 恒 False。
developer    = "kimi"
reviewer     = { adapter = "claude", provider = "kiroopus" }
consultant   = { adapter = "codex",  provider = "kirogpt" }

# 路径→测试命令规则。正式形式是 [[gate]]（kind="command", stage="pre_review"），
# 见 docs/QUICKSTART.zh-CN.md §「配置」。注意 `agentic init` 的模板生成的是
# [[quality_gate.rule]]，那个形式 quality-gate.sh 读不到，会 fail-closed 拒绝
# ——init 出来的默认配置过不了自己的质量门，属框架缺陷（候选 WP-08）。
#
# 本仓测试总量小，任何 src/ 或 tests/ 改动都跑全量 pytest。
# 命令写 python3.11：本机 python3 是 3.14 且没装 pytest，只有 3.11 装了。
# 注意 AGENTIC_PYTHON 只管 wrapper 自己的调用，管不到 rule.run 里的命令。
# 规则匹配是「首条命中者胜」（apply=first_match），所以不要在
# src/agentic_loop/** 之后再写 src/agentic_loop/wrappers/** —— 那条永不命中。
[[gate]]
kind  = "command"
stage = "pre_review"

[[gate.rule]]
match = "src/agentic_loop/**"
run   = ["python3.11 -m pytest tests -q"]

[[gate.rule]]
match = "tests/**"
run   = ["python3.11 -m pytest tests -q"]

[safety]
forbidden_paths  = [".env", ".context/"]
production_paths = []

[review_policy]
# 保持 weak，但理由已与「同源」无关：上面 reviewer=claude-opus-5 /
# consultant=gpt-5.6-sol 已是异源。真正的天花板在 engine 侧——
# gate/__init__.py 调 evaluate() 时 reviewer_id 硬编码为 None（reviewer 是
# orchestrator，没有 adapter identity），evaluate() 因此走 bootstrap 分支、
# compare_against 为 None，异源比较根本不会发生，最高只能返回 weak-attested。
# 换言之 strong 目前在 gate 路径上不可达（写 strong 会命中 gate 的
# bootstrap_override，带 warning 放行——那是自欺，不如如实写 weak）。
# reviewer 走上 adapter 且 identity 可观测后，这里才应升 strong。
min_independence = "weak"

# Optional autonomy policy: machine-checkable AUTO/STOP per orchestration action.
# Uncomment to opt in (absent = not gated). default_mode "ask" stops on every
# action not explicitly auto-approved; "ultra" auto-runs ultra_auto actions,
# but always_stop actions (push, production_write, credentials, …) stay hard-stopped.
# soft_limit_signals are the "stop-and-escalate" events the executor reports
# (frozen_hard / rework_twice / circuit_breaker), classified via
# `agentic autonomy signal <signal>`.
# 本迭代的目标就是多 Agent 并行，若每次派发都要人工点头，并行度等于 1。
# 因此开 ultra：派发/实现/测试/评审/本地 no-ff 合并全自动，
# 但 push、生产写、凭据等 always_stop 动作依旧硬停（ultra 也不放行）。
[autonomy]
default_mode = "ultra"
ultra_auto   = ["local_edit", "test_run", "worktree_lifecycle", "dispatch_developer",
                "review", "merge_gate", "local_merge_no_ff", "finalize_merge"]
always_stop  = ["push", "feishu_send", "production_write", "cron_change",
                "release_deploy", "credential_rw", "irreversible_git"]
soft_limit_signals = ["frozen_hard", "rework_twice", "circuit_breaker"]

[locks]
owner_source = "env:AGENTIC_SESSION_ID"
ttl_minutes  = 30
